[project]
name = "virtualos"
version = "0.1.0"
description = "VirtualOS API + Worker (suite Orkiza)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.55",
    "pyjwt[crypto]>=2.10",
    "duckduckgo-search>=6.3",
    "reportlab>=4.2",
    "sse-starlette>=2.1",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.33",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualos"]

[tool.uv]
# OneDrive no soporta hardlinks de forma confiable
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requiere servicios externos (DB real); excluido por defecto en CI",
]
