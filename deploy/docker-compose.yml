# VirtualOS demo deploy (single EC2): api + worker (same image) + caddy.
# The .env file lives next to this compose file on the server (never in git).

services:
  api:
    build: ../api
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build: ../api
    command: ["uv", "run", "--no-sync", "python", "-m", "virtualos.worker"]
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
